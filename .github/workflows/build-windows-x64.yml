name: Build Windows x64 (VC15 NTS)

on:
  workflow_dispatch:
  push:
    branches:
      - PHP-7.4-CVE-2026-109618-109619
    paths:
      - 'appveyor/**'
      - '.github/workflows/build-windows-x64.yml'

jobs:
  build:
    name: PHP 7.4 vc15 x64 NTS
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install VS2017 Build Tools (VC15 toolset 14.16)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/15/release/vs_buildtools.exe' -OutFile $bootstrapper
          $p = Start-Process -FilePath $bootstrapper -Wait -PassThru -ArgumentList @(
            '--quiet','--wait','--norestart','--nocache',
            '--add','Microsoft.VisualStudio.Workload.VCTools','--includeRecommended',
            '--add','Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '--add','Microsoft.VisualStudio.Component.Windows10SDK.17763'
          )
          if ($p.ExitCode -eq 3010) { Write-Host 'exit 3010 (reboot required) - acceptable in CI'; exit 0 }
          exit $p.ExitCode

      - name: Setup php-sdk 2.2.0 (patch deps server migration)
        shell: powershell
        run: |
          $sdk = Join-Path 'C:\build-cache' 'sdk'
          if (-not (Test-Path $sdk)) {
            git clone --branch php-sdk-2.2.0 --depth 1 https://github.com/php/php-sdk-binary-tools.git $sdk
            # SDK 2.2.0 fixes for the deps server migration (same as SDK >= 2.3 master):
            # 1) host/base: windows.php.net now 302-redirects to downloads.php.net/~windows
            # 2) new server's directory listing uses relative hrefs, SDK regex requires a
            #    leading slash -> make it optional so both listing formats parse
            $cfg = Join-Path $sdk 'lib\php\libsdk\SDK\Config.php'
            $c = Get-Content $cfg -Raw
            $c = $c.Replace('windows.php.net', 'downloads.php.net')
            $c = $c.Replace('/downloads/php-sdk/deps', '/~windows/php-sdk/deps')
            $c = $c.Replace(',/packages-(.+)-', ',/?packages-(.+)-')
            Set-Content $cfg $c
          }

      - name: Fetch PHP 7.4 deps (direct download, bypass phpsdk_deps)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = 'C:\build-cache\deps-7.4-vc15-x64'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          $base = 'https://downloads.php.net/~windows/php-sdk/deps'
          $tmp = Join-Path $env:RUNNER_TEMP 'depspkg'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $series = (Invoke-WebRequest -UseBasicParsing "$base/series/packages-7.4-vc15-x64-staging.txt").Content -split "`r?`n" |
            ForEach-Object { $_.Trim() } | Where-Object { $_ }
          Write-Host "Packages to fetch: $($series.Count)"
          foreach ($name in $series) {
            $dest = Join-Path $tmp $name
            if (Test-Path $dest) { continue }
            $ok = $false
            for ($i = 1; $i -le 5; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing "$base/vc15/x64/$name" -OutFile $dest
                $ok = $true; break
              } catch {
                Write-Host "retry $i for ${name}: $($_.Exception.Message)"
                Start-Sleep -Seconds (2 * $i)
              }
            }
            if (-not $ok) { throw "Failed to download $name after 5 attempts" }
          }
          Get-ChildItem $tmp -Filter *.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath $deps -Force
          }
          New-Item -ItemType File -Force -Path (Join-Path $deps '.deps-ready') | Out-Null
          Write-Host "Deps ready in $deps"

      - name: Build via official php-sdk 2.2.0 recipe
        shell: cmd
        env:
          PHP_BUILD_CACHE_BASE_DIR: C:\build-cache
          PHP_BUILD_OBJ_DIR: C:\obj
          PHP_BUILD_CACHE_SDK_DIR: C:\build-cache\sdk
          PHP_BUILD_SDK_BRANCH: php-sdk-2.2.0
          PHP_BUILD_CRT: vc15
          PLATFORM: x64
          THREAD_SAFE: 0
        run: |
          set APPVEYOR_BUILD_FOLDER=%GITHUB_WORKSPACE%
          set APPVEYOR_REPO_BRANCH=PHP-7.4-CVE-2026-109618-109619
          if exist "C:\build-cache\.build-ok" del /f "C:\build-cache\.build-ok"
          call "%PHP_BUILD_CACHE_SDK_DIR%\phpsdk-vc15-x64.bat" -t "%APPVEYOR_BUILD_FOLDER%\appveyor\build_task_release.bat"
          rem the SDK starter swallows the task exit code - verify success marker
          if not exist "C:\build-cache\.build-ok" exit /b 1

      - name: Collect package zips
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'artifacts'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -Path 'C:\obj' -Recurse -Filter *.zip -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'Win32-vc15-x64' } |
            Copy-Item -Destination $stage
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-7.4-Win32-vc15-x64-NTS
          path: ${{ runner.temp }}\artifacts\*
          if-no-files-found: error
